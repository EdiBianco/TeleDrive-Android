name: Android Build

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          SDKM=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -path '*/bin/*' | head -1)
          echo "$(dirname "$SDKM")" >> "$GITHUB_PATH"
          yes | "$SDKM" --licenses > /dev/null

      - name: Install Android NDK and platform
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Initialize Tauri Android project
        run: npm run tauri android init -- --ci

      - name: Disable Android backup of app data
        # The session string lives in the app data dir; keep it out of adb and Google backups.
        run: |
          python3 - <<'PY'
          import glob, re
          path = glob.glob('src-tauri/gen/android/app/src/main/AndroidManifest.xml')[0]
          xml = open(path, encoding='utf-8').read()
          if 'android:allowBackup=' in xml:
              xml = re.sub(r'android:allowBackup="[^"]*"', 'android:allowBackup="false"', xml, count=1)
          else:
              xml = xml.replace('<application', '<application android:allowBackup="false"', 1)
          open(path, 'w', encoding='utf-8').write(xml)
          PY

      - name: Build debug APK
        run: npm run tauri android build -- --apk --debug --target aarch64

      # Re-sign with the fixed release key so each build installs over the previous one.
      # Debug signing uses a new key on every runner, which Android rejects as a signature conflict.
      - name: Sign APK with release key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          "$BT/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.p12" \
            --ks-key-alias "$KS_ALIAS" \
            --ks-pass env:KS_PASS \
            --key-pass env:KS_PASS \
            --out teledrive-android.apk \
            "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs teledrive-android.apk
          rm -f "$RUNNER_TEMP/release.p12" "$RUNNER_TEMP/aligned.apk"

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="v${VERSION}-android.${GITHUB_RUN_NUMBER}"
          NOTES_FILE="release-notes/${VERSION}.md"
          if [ -f "$NOTES_FILE" ]; then
            NOTES_ARG=(--notes-file "$NOTES_FILE")
          else
            NOTES_ARG=(--notes "Improvements and fixes.")
          fi
          gh release create "$TAG" teledrive-android.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "TeleDrive ${VERSION} (Android build ${GITHUB_RUN_NUMBER})" \
            "${NOTES_ARG[@]}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: teledrive-android
          path: teledrive-android.apk
          if-no-files-found: error
