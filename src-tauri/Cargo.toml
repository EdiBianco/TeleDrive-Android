[package]
name = "teledrive"
version = "0.1.16"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "teledrive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "TeleDrive"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-stronghold = "2.3.1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-process = "2.3.1"
tauri-plugin-keystore = { path = "plugins/tauri-plugin-keystore" }
tauri-plugin-keepalive = { path = "plugins/tauri-plugin-keepalive" }
tauri-plugin-storage = { path = "plugins/tauri-plugin-storage" }
tauri-plugin-apkupdate = { path = "plugins/tauri-plugin-apkupdate" }
tauri-plugin-fileshare = { path = "plugins/tauri-plugin-fileshare" }
argon2 = "0.5.3"
tokio = { version = "1", features = ["sync", "time"] }

# Size: strip debuginfo and symbols from the native library (the APK ships libteledrive_lib.so)
[profile.dev]
debug = false
strip = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
