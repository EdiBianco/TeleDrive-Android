[package]
name = "tauri-plugin-keystore"
version = "0.1.0"
authors = ["EdiBianco"]
links = "tauri-plugin-keystore"
description = "Seals and opens vault values with a non-exportable Android Keystore key"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]

[dependencies]
tauri = { version = "2.11.3" }
serde = "1.0"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
