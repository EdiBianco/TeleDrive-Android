[package]
name = "tauri-plugin-storage"
version = "0.1.0"
authors = ["EdiBianco"]
description = "Reads Android photo, video, and folder sources for device backup (MediaStore and Storage Access Framework)"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-storage"

[dependencies]
tauri = { version = "2.11.3" }
serde = "1.0"
base64 = "0.13"
serde_json = "1.0"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
