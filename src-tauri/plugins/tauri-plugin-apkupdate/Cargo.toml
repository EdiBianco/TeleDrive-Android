[package]
name = "tauri-plugin-apkupdate"
version = "0.1.0"
authors = ["EdiBianco"]
description = "Checks GitHub for a newer TeleDrive APK, downloads it with checksum verification, and opens the system installer"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-apkupdate"

[dependencies]
tauri = { version = "2.11.3" }
serde = "1.0"
base64 = "0.13"
serde_json = "1.0"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
